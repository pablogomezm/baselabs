services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    container_name: bobs-corn-backend
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    container_name: bobs-corn-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
